[package]
name = "dis-gen-ieee-1278-gen-3"
version = "0.1.0"
description = """
Code generator for Distributed Interactive Simulation (IEEE-1278.1) protocol version 8 ('gen 3') schema definitions, as used in the dis-rs crate.
"""
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords = ["IEEE-1278-1", "generator", "DIS", "v8"]

[dependencies]
itertools = "0.15.0"
quote = "1.0.47"
quick-xml = "0.40.1"
proc-macro2 = "1.0.107"
prettyplease = "0.3.0"
syn = "3.0.10"
dis-gen-utils = { path = "../dis-gen-utils" }
dis-gen-siso-ref-010 = { path = "../dis-gen-siso-ref-010" }
slotmap = "1.1.1"

[lints]
workspace = true
